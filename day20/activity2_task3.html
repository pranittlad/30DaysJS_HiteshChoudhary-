<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save User Input</title>
</head>
<body>

    <h2>Enter Your Information</h2>
    
    <form id="userForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" required><br><br>
        
        <button type="submit">Save</button>
    </form>

    <h3>Saved Data:</h3>
    <p id="savedData"></p>

    <script>
        
        function saveData(event) {
            event.preventDefault(); 

              let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            
            localStorage.setItem('userData', JSON.stringify({ name: name, email: email }));

            display();
        }

        function display() {
            let savedDataElement = document.getElementById('savedData');
            let savedString = localStorage.getItem('userData'); 

            if (savedString) {
                const savedData = JSON.parse(savedString);
                savedDataElement.textContent = `Name: ${savedData.name}, Email: ${savedData.email}`;
            } else {
                savedDataElement.textContent = `No data saved.`;
            }
        }

        document.getElementById('userForm').addEventListener('submit', saveData);

        window.onload = display;
    </script>
</body>
</html>
